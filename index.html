<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e3a8a'><path d='M12 2L1 21h22L12 2zm0 3.5l8.5 14.5H3.5L12 5.5z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金融借贷纠纷智能裁判与债权清算助理 - AI Agent 驱动</title>
    <!-- 引入 Tailwind CDN 保障现代样式毫秒级完整渲染 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f5ff',
                100: '#e0ebff',
                500: '#2563eb',
                600: '#1d4ed8',
                700: '#1e40af',
                800: '#1e3a8a',
                900: '#0f172a',
              },
              court: {
                navy: '#0b192c',
                blue: '#1e3e62',
                accent: '#f97316',
                gold: '#d97706',
              }
            }
          }
        }
      }
    </script>
    <style>
      @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .animate-pulse-slow {
        animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
